<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 300" role="img" aria-labelledby="capsule-t capsule-d" fill="none" stroke="currentColor" stroke-width="1.25" font-family="var(--font-mono), ui-monospace, monospace" font-size="11" letter-spacing="0.04em">
  <title id="capsule-t">Flux Capsule : configurateur, devis, chiffrage par l'atelier, paiement de la marque, projet et suivi de production</title>
  <desc id="capsule-d">La marque remplit le configurateur, le devis est persisté avec ses fichiers techniques privés. L'atelier chiffre le devis, ce qui crée le compte client. La marque paie, ce qui crée le projet et son expédition. L'atelier fait avancer les neuf étapes de production, visibles côté marque.</desc>
  <g data-step="1">
    <path data-draw d="M20 40 H195 V104 H20 Z"/>
    <g data-label fill="currentColor" stroke="none"><text x="32" y="64">MARQUE</text><text x="32" y="86" opacity="0.6">configurateur 6 étapes</text></g>
  </g>
  <g data-step="2">
    <path data-draw d="M195 72 H235"/>
    <path data-draw d="M235 40 H486 V104 H235 Z"/>
    <g data-label fill="currentColor" stroke="none"><text x="247" y="64">QUOTE · PENDING</text><text x="247" y="86" opacity="0.6">POST /api/quote · fichiers privés</text></g>
  </g>
  <g data-step="3">
    <path data-draw d="M486 72 H526"/>
    <path data-draw stroke="var(--signal)" d="M526 40 H736 V104 H526 Z"/>
    <g data-label fill="currentColor" stroke="none"><text x="538" y="64" fill="var(--signal)">ATELIER · chiffrage</text><text x="538" y="86" opacity="0.6">PRICED → compte client créé</text></g>
  </g>
  <g data-step="4">
    <path data-draw d="M631 104 V160"/>
    <path data-draw d="M526 160 H722 V224 H526 Z"/>
    <g data-label fill="currentColor" stroke="none"><text x="538" y="184">MARQUE · paiement</text><text x="538" y="206" opacity="0.6">PAID → PROJECT + SHIPMENT</text></g>
  </g>
  <g data-step="5">
    <path data-draw d="M722 192 H762"/>
    <path data-draw d="M762 160 H1013 V224 H762 Z"/>
    <g data-label fill="currentColor" stroke="none"><text x="774" y="184">PRODUCTION · 9 étapes</text><text x="774" y="206" opacity="0.6">coupe · couture · qualité · envoi</text></g>
  </g>
  <g data-step="6">
    <path data-draw d="M887 224 V264 H107 V104"/>
    <g data-label fill="currentColor" stroke="none"><text x="235" y="258" opacity="0.6">la marque suit la même timeline, adresse modifiable tant que rien n'est expédié</text></g>
  </g>
</svg>
