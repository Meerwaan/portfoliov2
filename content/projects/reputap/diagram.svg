<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" role="img" aria-labelledby="reputap-t reputap-d" fill="none" stroke="currentColor" stroke-width="1.25" font-family="var(--font-mono), ui-monospace, monospace" font-size="11" letter-spacing="0.04em">
  <title id="reputap-t">Flux Reputap : scan NFC, session, avis, tirage serveur, ticket, validation en caisse</title>
  <desc id="reputap-d">Une plaque NFC ouvre une URL à jeton. Le serveur crée une session de scan. Le client ouvre Google. Le serveur tire la roue et émet un ticket. Le commerçant valide ou rejette le ticket en caisse.</desc>
  <g data-step="1">
    <path data-draw d="M20 40 H113 V104 H20 Z"/>
    <g data-label fill="currentColor" stroke="none"><text x="32" y="64">PLAQUE NFC</text><text x="32" y="86" opacity="0.6">/s/{token}</text></g>
  </g>
  <g data-step="2">
    <path data-draw d="M113 72 H153"/>
    <path data-draw d="M153 40 H328 V104 H153 Z"/>
    <g data-label fill="currentColor" stroke="none"><text x="165" y="64">SCAN_SESSION</text><text x="165" y="86" opacity="0.6">device · ip_hash · ttl</text></g>
  </g>
  <g data-step="3">
    <path data-draw d="M328 72 H368"/>
    <path data-draw d="M368 40 H481 V104 H368 Z"/>
    <g data-label fill="currentColor" stroke="none"><text x="380" y="64">AVIS GOOGLE</text><text x="380" y="86" opacity="0.6">review_intent</text></g>
  </g>
  <g data-step="4">
    <path data-draw d="M424 104 V160"/>
    <path data-draw stroke="var(--signal)" d="M368 160 H592 V224 H368 Z"/>
    <g data-label fill="currentColor" stroke="none"><text x="380" y="184" fill="var(--signal)">POST /api/spin</text><text x="380" y="206" opacity="0.6">tirage serveur · poids · caps</text></g>
  </g>
  <g data-step="5">
    <path data-draw d="M592 192 H632"/>
    <path data-draw d="M632 160 H807 V224 H632 Z"/>
    <g data-label fill="currentColor" stroke="none"><text x="644" y="184">TICKET</text><text x="644" y="206" opacity="0.6">ISSUED · code · expire</text></g>
  </g>
  <g data-step="6">
    <path data-draw d="M719 224 V264 H230 V224"/>
    <path data-draw d="M153 160 H308 V224 H153 Z"/>
    <g data-label fill="currentColor" stroke="none"><text x="165" y="184">CAISSE</text><text x="165" y="206" opacity="0.6">REDEEMED / REJECTED</text></g>
  </g>
</svg>
