<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="reputap-diagram-title reputap-diagram-desc" fill="none" stroke="currentColor" stroke-width="1.25" font-family="var(--font-mono), ui-monospace, monospace" font-size="11" letter-spacing="0.04em">
  <title id="reputap-diagram-title">Flux Reputap : scan NFC, session, avis, tirage serveur, ticket, validation</title>
  <desc id="reputap-diagram-desc">Une plaque NFC ouvre une URL à jeton. Le serveur crée une session de scan. Le client ouvre Google. Le serveur tire la roue et émet un ticket. Le commerçant valide ou rejette le ticket.</desc>
  <g data-step="1">
    <path data-draw d="M20 40 H180 V110 H20 Z"/>
    <g data-label fill="currentColor" stroke="none"><text x="32" y="64">PLAQUE NFC</text><text x="32" y="86" opacity="0.6">/s/{token}</text></g>
  </g>
  <g data-step="2">
    <path data-draw d="M180 75 H240"/>
    <path data-draw d="M240 40 H400 V110 H240 Z"/>
    <g data-label fill="currentColor" stroke="none"><text x="252" y="64">SCAN_SESSION</text><text x="252" y="86" opacity="0.6">device · ip_hash · ttl</text></g>
  </g>
  <g data-step="3">
    <path data-draw d="M400 75 H460"/>
    <path data-draw d="M460 40 H620 V110 H460 Z"/>
    <g data-label fill="currentColor" stroke="none"><text x="472" y="64">AVIS GOOGLE</text><text x="472" y="86" opacity="0.6">review_intent</text></g>
  </g>
  <g data-step="4">
    <path data-draw d="M540 110 V160"/>
    <path data-draw stroke="var(--signal)" d="M460 160 H620 V230 H460 Z"/>
    <g data-label fill="currentColor" stroke="none"><text x="472" y="184" fill="var(--signal)">POST /api/spin</text><text x="472" y="206" opacity="0.6">tirage serveur · poids · caps</text></g>
  </g>
  <g data-step="5">
    <path data-draw d="M620 195 H680"/>
    <path data-draw d="M680 160 H840 V230 H680 Z"/>
    <g data-label fill="currentColor" stroke="none"><text x="692" y="184">TICKET</text><text x="692" y="206" opacity="0.6">ISSUED · code · expire</text></g>
  </g>
  <g data-step="6">
    <path data-draw d="M760 230 V270 H320 V230"/>
    <path data-draw d="M240 160 H400 V230 H240 Z"/>
    <g data-label fill="currentColor" stroke="none"><text x="252" y="184">CAISSE</text><text x="252" y="206" opacity="0.6">REDEEMED / REJECTED</text></g>
  </g>
</svg>
